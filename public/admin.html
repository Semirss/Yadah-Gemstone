<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Yadah Gemstone PLC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        /* [PRESERVED FROM USER] Custom background gradient for login */
        body.login-bg {
            background: #0f172a; /* Slate 900 fallback */
            background-image: radial-gradient(at 0% 0%, #1e3a8a 0%, transparent 50%),
                              radial-gradient(at 100% 100%, #4f46e5 0%, transparent 50%),
                              linear-gradient(to bottom right, #0f172a, #020617);
            min-height: 100vh;
            overflow: hidden; /* Prevent scrolling on login page */
        }

        /* [PRESERVED FROM USER] Fade-in for the card */
        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* [PRESERVED FROM USER] Custom glow effect on button hover */
        .btn-glow:hover {
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.6), 0 0 5px rgba(99, 102, 241, 0.3);
        }

        /* [ENHANCED] Advanced styles for the admin dashboard */
        :root {
            --color-primary: #4f46e5; /* Indigo 600 */
            --color-primary-hover: #4338ca; /* Indigo 700 */
        }
        
        body.dashboard-bg {
            background-color: #f1f5f9; /* Slate 100 */
            overflow-y: auto; /* Allow scrolling only in dashboard */
        }
        
        .font-sans { font-family: 'Inter', sans-serif; }

        /* [NEW] Sidebar link styling */
        .sidebar-link.active {
            background-color: var(--color-primary);
            color: #ffffff;
            font-weight: 600;
        }
        .sidebar-link.active svg {
            color: #ffffff;
        }

        .skeleton-loader {
            background-color: #e2e8f0; /* Slate 200 */
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            50% { opacity: .5; }
        }

        .image-preview {
            margin-top: 1rem;
            max-height: 200px;
            width: 100%;
            object-fit: cover;
            border-radius: 0.75rem;
            border: 1px solid #e2e8f0; /* Slate 200 */
        }

        .loading-spinner {
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            width: 1rem;
            height: 1rem;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .slide-up {
            animation: slideUp 0.5s ease-out forwards;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .scale-in {
            animation: scaleIn 0.3s ease-out forwards;
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .bg-primary { background-color: var(--color-primary); }
        .hover\:bg-primary-hover:hover { background-color: var(--color-primary-hover); }
        .text-primary { color: var(--color-primary); }
        .ring-primary { --tw-ring-color: var(--color-primary); }
        .border-primary { border-color: var(--color-primary); }

        /* Utility functions from old code */
        .btn-loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 24px;
            border-radius: 4px;
            color: white;
            z-index: 1000;
            animation: toastIn 0.5s ease-out, toastOut 0.5s ease-in 4.5s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .toast-success { background-color: #10B981; }
        .toast-error { background-color: #EF4444; }
        
        @keyframes toastIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes toastOut {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(100%); opacity: 0; }
        }
        
        .draggable {
            cursor: move;
            transition: transform 0.2s ease;
        }
        
        .draggable.dragging {
            opacity: 0.5;
            transform: scale(0.98);
        }
        
        .sortable-ghost {
            opacity: 0.3;
            background: #E5E7EB;
        }

        #modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 1rem;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        #modal:not(.hidden) {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: white;
            border-radius: 0.75rem;
            max-width: 32rem;
            width: 100%;
            max-height: 90vh;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        #modal:not(.hidden) .modal-content {
            transform: scale(1);
        }

        /* Mobile sidebar styles */
        .sidebar-mobile-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 40;
            display: none;
        }

        .sidebar-mobile-overlay.active {
            display: block;
        }

        .sidebar-mobile {
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
        }

        .sidebar-mobile.active {
            transform: translateX(0);
        }

        @media (min-width: 1024px) {
            .sidebar-mobile-overlay {
                display: none !important;
            }
        }

        /* Hide dashboard completely when not logged in */
        #adminDashboard {
            display: none;
        }
        
        /* Ensure login container takes full viewport */
        #loginContainer {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="font-sans antialiased login-bg">

<!-- Login Container - Only this should be visible when not logged in -->
<div id="loginContainer">
  <div class="w-full max-w-md bg-slate-800/80 backdrop-blur-sm 
     rounded-2xl border border-indigo-500/30 shadow-2xl shadow-indigo-900/40 
     p-8 md:p-10 fade-in transition-all duration-300">
    <h2 class="text-4xl font-extrabold text-center mb-10 text-white tracking-wider">
        Admin <span class="text-indigo-400">Access</span>
    </h2>
    <form id="loginFormElement">
        <div class="mb-6">
            <label class="block text-indigo-300 text-sm font-semibold mb-2" for="username">
                Username
            </label>
            <input type="text" id="username" name="username" required
                placeholder="Enter system username"
                class="w-full px-5 py-3 bg-slate-700/70 text-white placeholder-slate-400 
                    border border-slate-700 rounded-xl focus:outline-none 
                    focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 
                    transition-all duration-300 ease-in-out">
        </div>
        <div class="mb-8">
            <label class="block text-indigo-300 text-sm font-semibold mb-2" for="password">
                Password
            </label>
            <input type="password" id="password" name="password" required
                placeholder="Input secure password"
                class="w-full px-5 py-3 bg-slate-700/70 text-white placeholder-slate-400 
                    border border-slate-700 rounded-xl focus:outline-none 
                    focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 
                    transition-all duration-300 ease-in-out">
        </div>
        <button type="submit" id="loginBtn"
            class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white 
                py-3.5 px-4 rounded-xl font-bold text-lg tracking-wide 
                shadow-lg shadow-indigo-500/30 hover:shadow-xl btn-glow
                transition-all duration-300 transform hover:scale-[1.01] 
                focus:outline-none focus:ring-4 focus:ring-indigo-500 focus:ring-opacity-50">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-3 inline-block" viewBox="0 0 24 24" fill="currentColor">
                <path fill-rule="evenodd" d="M12 1.5a5.25 5.25 0 00-5.25 5.25v3a3 3 0 00-3 3v6.75a3 3 0 003 3h10.5a3 3 0 003-3v-6.75a3 3 0 00-3-3v-3c0-2.9-2.35-5.25-5.25-5.25zm3.75 8.25V6.75a3.75 3.75 0 10-7.5 0v3h7.5z" clip-rule="evenodd" />
            </svg>
            Secure Login
        </button>
    </form>
    <div id="loginError" class="mt-6 p-3 bg-red-900/50 border border-red-700 text-red-300 text-center rounded-lg hidden">
        <!-- Error message will appear here -->
    </div>
  </div>
</div>

<!-- Admin Dashboard - Completely separate, only shown after login -->

    <header class="bg-white/80 backdrop-blur-sm border-b border-slate-200 p-4 sticky top-0 z-30 flex lg:hidden items-center justify-between">

            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-slate-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>

        <div class="w-10"></div> <!-- Spacer for balance -->

                    <span>Our Sectors</span>
                </button>
                <button class="sidebar-link flex items-center space-x-3 px-4 py-2.5 rounded-lg hover:bg-slate-700 transition-colors duration-200" data-tab="commitments">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>

                    <span>Mining</span>
                </button>
                <button class="sidebar-link flex items-center space-x-3 px-4 py-2.5 rounded-lg hover:bg-slate-700 transition-colors duration-200" data-tab="agriculture">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2h10a2 2 0 002-2v-1a2 2 0 012-2h1.945M7.884 5.036A9.003 9.003 0 0112 3c1.789 0 3.47.533 4.884 1.448M10 21h4" /></svg>
                    <span>Agriculture</span>
                </button>
            </nav>
            
            <div class="mt-auto">
                 <button id="logoutBtn" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-red-400 hover:bg-red-500 hover:text-white transition-colors duration-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd" /></svg>
                    <span class="font-semibold">Logout</span>
                </button>
            </div>
        </aside>

        <!-- Sidebar for Mobile -->
        <aside id="mobileSidebar" class="sidebar-mobile fixed top-0 left-0 h-full w-64 bg-slate-800 text-slate-300 p-4 z-50 lg:hidden">
            <div class="flex items-center justify-between mb-10 px-2">
                <div class="flex items-center space-x-3">
                    <div class="bg-indigo-600 p-2 rounded-lg text-white">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
                    </div>
                    <h1 class="text-xl font-bold text-white">Admin Panel</h1>
                </div>
                <button id="closeMobileMenu" class="p-2 rounded-lg text-slate-300 hover:bg-slate-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            
            <nav class="flex-1 flex flex-col space-y-2">
                <button class="sidebar-link flex items-center space-x-3 px-4 py-2.5 rounded-lg hover:bg-slate-700 transition-colors duration-200 active" data-tab="sectors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                    <span>Our Sectors</span>
                </button>
                <button class="sidebar-link flex items-center space-x-3 px-4 py-2.5 rounded-lg hover:bg-slate-700 transition-colors duration-200" data-tab="commitments">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>
                    <span>Our Commitment</span>
                </button>
                <button class="sidebar-link flex items-center space-x-3 px-4 py-2.5 rounded-lg hover:bg-slate-700 transition-colors duration-200" data-tab="leadership">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                    <span>Leadership Team</span>
                </button>
                <button class="sidebar-link flex items-center space-x-3 px-4 py-2.5 rounded-lg hover:bg-slate-700 transition-colors duration-200" data-tab="mining">

            <div class="mt-auto">
                 <button id="logoutBtnMobile" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-red-400 hover:bg-red-500 hover:text-white transition-colors duration-200">

                    <span class="font-semibold">Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col bg-slate-100 overflow-y-auto">
            <header class="hidden lg:flex bg-white/80 backdrop-blur-sm border-b border-slate-200 p-4 sticky top-0 z-10">
                <h1 id="pageTitleDesktop" class="text-2xl font-bold text-slate-800">Our Sectors</h1>
            </header>

            <div id="tabContent" class="p-4 lg:p-6">
                <!-- Sectors Tab -->
                <div id="sectorsTab" class="tab-panel slide-up">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 lg:p-6">
                        <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 mb-6">

<!-- Toast Container -->
<div id="toastContainer" class="fixed bottom-5 right-5 z-[100] space-y-3"></div>

<script>
    // Your existing backend-compatible JavaScript from the old code
    const API_BASE = '/api';
    let token = localStorage.getItem('adminToken');
    let currentTab = 'sectors';

    // Mobile sidebar functionality
    function toggleMobileSidebar() {
        const mobileSidebar = document.getElementById('mobileSidebar');
        const overlay = document.getElementById('sidebarOverlay');
        
        mobileSidebar.classList.toggle('active');
        overlay.classList.toggle('active');
        
        // Prevent body scroll when sidebar is open
        document.body.style.overflow = mobileSidebar.classList.contains('active') ? 'hidden' : '';
    }

    function closeMobileSidebar() {
        const mobileSidebar = document.getElementById('mobileSidebar');
        const overlay = document.getElementById('sidebarOverlay');
        
        mobileSidebar.classList.remove('active');
        overlay.classList.remove('active');
        document.body.style.overflow = '';
    }

    // Utility functions for loading states
    function showLoading(button) {
        const originalText = button.innerHTML;
        button.innerHTML = '<div class="loading-spinner"></div> Loading...';
        button.disabled = true;
        button.classList.add('btn-loading');
        return originalText;
    }

    function hideLoading(button, originalText) {
        button.innerHTML = originalText;
        button.disabled = false;
        button.classList.remove('btn-loading');
    }

    function showGlobalLoading() {
        document.getElementById('globalLoading').classList.remove('hidden');
    }

    function hideGlobalLoading() {
        document.getElementById('globalLoading').classList.add('hidden');
    }

    function showTabLoading(tab) {
        const loadingElement = document.getElementById(`${tab}Loading`);
        const listElement = document.getElementById(`${tab}List`);
        if (loadingElement && listElement) {
            loadingElement.classList.remove('hidden');
            listElement.innerHTML = '';
        }
    }

    function hideTabLoading(tab) {
        const loadingElement = document.getElementById(`${tab}Loading`);
        if (loadingElement) {
            loadingElement.classList.add('hidden');
        }
    }

    // Toast notification
    function showToast(message, type = 'success') {
        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        toast.textContent = message;
        document.getElementById('toastContainer').appendChild(toast);
        setTimeout(() => toast.remove(), 5000);
    }

    // Image preview function
    function previewImage(input, previewId) {
        const preview = document.getElementById(previewId);
        if (input.value) {
            preview.src = input.value;
            preview.classList.remove('hidden');
        } else {
            preview.classList.add('hidden');
        }
    }

    // Drag and drop sorting
    function initSortable(listId) {
        const list = document.getElementById(listId);
        if (!list) return;
        list.addEventListener('dragstart', (e) => {
            e.target.closest('.draggable').classList.add('dragging');
        });
        list.addEventListener('dragend', (e) => {
            e.target.closest('.draggable').classList.remove('dragging');
        });
        list.addEventListener('dragover', (e) => {
            e.preventDefault();
            const afterElement = getDragAfterElement(list, e.clientY);
            const draggable = document.querySelector('.dragging');
            if (afterElement == null) {
                list.appendChild(draggable);
            } else {
                list.insertBefore(draggable, afterElement);
            }
        });
        list.addEventListener('drop', async (e) => {
            const items = Array.from(list.children);
            const type = listId.replace('List', '');
            const endpoint = getEndpoint(type.slice(0, -1)); // Remove 's' for singular
            showGlobalLoading();
            try {
                for (let i = 0; i < items.length; i++) {
                    const id = items[i].dataset.id;
                    await fetch(`${API_BASE}/${endpoint}/${id}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ display_order: i + 1 })
                    });
                }
                showToast('Order updated successfully!');
            } catch (error) {
                showToast('Error updating order', 'error');
            } finally {
                hideGlobalLoading();
            }
        });
    }

    function getDragAfterElement(container, y) {
        const draggableElements = [...container.querySelectorAll('.draggable:not(.dragging)')];
        return draggableElements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) {
                return { offset: offset, element: child };
            } else {
                return closest;
            }
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    // Search function
    function searchItems(listId, searchId) {
        const search = document.getElementById(searchId).value.toLowerCase();
        const list = document.getElementById(listId);
        Array.from(list.children).forEach(item => {
            const text = item.textContent.toLowerCase();
            item.style.display = text.includes(search) ? '' : 'none';
        });
    }

    // Sort function (client-side by display_order)
    function sortItems(tab) {
        const list = document.getElementById(`${tab}List`);
        const items = Array.from(list.children);
        items.sort((a, b) => (a.dataset.order || 0) - (b.dataset.order || 0));
        items.forEach(item => list.appendChild(item));
        showToast('Items sorted by display order');
    }

    // Check if user is already logged in
    if (token) {
        showDashboard();
    }

    // Login functionality
    document.getElementById('loginFormElement').addEventListener('submit', async (e) => {
        e.preventDefault();
        const button = document.getElementById('loginBtn');
        const originalText = showLoading(button);
        
        const formData = new FormData(e.target);
        const credentials = {
            username: formData.get('username'),
            password: formData.get('password')
        };

        try {
            const response = await fetch(`${API_BASE}/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(credentials)
            });

            const data = await response.json();

            if (response.ok) {
                token = data.token;
                localStorage.setItem('adminToken', token);
                showDashboard();
            } else {
                document.getElementById('loginError').textContent = data.error;
                document.getElementById('loginError').classList.remove('hidden');
            }
        } catch (error) {
            document.getElementById('loginError').textContent = 'Login failed. Please try again.';
            document.getElementById('loginError').classList.remove('hidden');
        } finally {
            hideLoading(button, originalText);
        }
    });

    // Logout functionality
    function handleLogout() {
        localStorage.removeItem('adminToken');
        token = null;
        document.getElementById('adminDashboard').style.display = 'none';
        document.getElementById('loginContainer').style.display = 'flex';
        document.body.classList.remove('dashboard-bg');
        document.body.classList.add('login-bg');
        document.body.style.overflow = 'hidden'; // Prevent scrolling on login page
        closeMobileSidebar();
    }

    document.getElementById('logoutBtn').addEventListener('click', handleLogout);
    document.getElementById('logoutBtnMobile').addEventListener('click', handleLogout);

    // Mobile menu functionality
    document.getElementById('mobileMenuBtn').addEventListener('click', toggleMobileSidebar);
    document.getElementById('closeMobileMenu').addEventListener('click', closeMobileSidebar);
    document.getElementById('sidebarOverlay').addEventListener('click', closeMobileSidebar);

    // Tab functionality
    function setupTabNavigation() {
        const tabButtons = document.querySelectorAll('.sidebar-link');
        
        tabButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                // Update active tab
                document.querySelectorAll('.sidebar-link').forEach(b => {
                    b.classList.remove('active');
                });
                btn.classList.add('active');

                // Update page title
                const tabName = btn.dataset.tab;
                const pageTitle = document.getElementById('pageTitle');
                const pageTitleDesktop = document.getElementById('pageTitleDesktop');
                
                let titleText = '';
                switch(tabName) {
                    case 'sectors': titleText = 'Our Sectors'; break;
                    case 'commitments': titleText = 'Our Commitment'; break;
                    case 'leadership': titleText = 'Leadership Team'; break;
                    case 'mining': titleText = 'Mining Vision & Minerals'; break;
                    case 'agriculture': titleText = 'Agricultural Products'; break;
                }
                
                if (pageTitle) pageTitle.textContent = titleText;
                if (pageTitleDesktop) pageTitleDesktop.textContent = titleText;

                // Show active tab content
                document.querySelectorAll('.tab-panel').forEach(panel => {
                    panel.classList.add('hidden');
                });
                const activePanel = document.getElementById(`${tabName}Tab`);
                activePanel.classList.remove('hidden');
                activePanel.classList.add('slide-up');

                // Load tab data
                currentTab = tabName;
                loadTabData(tabName);
                
                // Close mobile sidebar after selecting a tab
                closeMobileSidebar();
            });
        });
    }

    function showDashboard() {
        document.getElementById('loginContainer').style.display = 'none';
        document.getElementById('adminDashboard').style.display = 'flex';
        document.body.classList.remove('login-bg');
        document.body.classList.add('dashboard-bg');
        document.body.style.overflow = 'auto'; // Allow scrolling in dashboard
        setupTabNavigation();
        loadTabData('sectors');
    }

    async function loadTabData(tabName) {
        showTabLoading(tabName);
        
        try {
            switch (tabName) {
                case 'sectors':
                    await loadSectors();
                    initSortable('sectorsList');

    async function handleFormSubmit(e, type) {
        e.preventDefault();
        const button = document.getElementById('modalSubmitBtn');
        const originalText = showLoading(button);
        showGlobalLoading();

        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());

        // Convert display_order to number
        if (data.display_order) {
            data.display_order = parseInt(data.display_order);
        }

        try {
            const response = await fetch(`${API_BASE}/${getEndpoint(type)}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                closeModal();
                loadTabData(getTabName(type));
                showToast('Item added successfully!');
            } else {
                showToast('Error adding item', 'error');
            }
        } catch (error) {
            showToast('Error adding item', 'error');
        } finally {
            hideLoading(button, originalText);
            hideGlobalLoading();
        }
    }

        const endpoints = {
            sector: 'sectors',
            commitment: 'commitments',
            leadership: 'leadership',
            mineral: 'minerals',
            agriculturalProduct: 'agricultural-products'
        };
        return endpoints[type];
    }

    function getTabName(type) {
        const tabs = {
            sector: 'sectors',
            commitment: 'commitments',
            leadership: 'leadership',
            mineral: 'mining',
            agriculturalProduct: 'agriculture'
        };
        return tabs[type];
    }

    function closeModal() {
        document.getElementById('modal').classList.add('hidden');

    async function deleteItem(type, id) {
        if (!confirm('Are you sure you want to delete this item?')) return;

        showGlobalLoading();
        
        try {
            const response = await fetch(`${API_BASE}/${getEndpoint(type)}/${id}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.ok) {
                loadTabData(getTabName(type));
                showToast('Item deleted successfully!');
            } else {
                showToast('Error deleting item', 'error');
                }
        } catch (error) {
            showToast('Error deleting item', 'error');
        } finally {
            hideGlobalLoading();
        }
    }
